<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNARSE X - Meet The Developers</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        pixel: ['"Press Start 2P"', 'monospace'],
                    },
                    colors: {
                        navy: {
                            950: '#070a14',
                            900: '#0b0f1e',
                            800: '#12182d',
                            700: '#1c2541',
                        },
                        amberbtn: {
                            DEFAULT: '#e69d35',
                            hover: '#cf8729',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Press Start 2P Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Force pixelated retro typography across all elements */
        body, h1, h2, h3, h4, h5, h6, p, span, button, input, select, textarea, label, div {
            font-family: 'Press Start 2P', monospace !important;
            letter-spacing: 0.4px;
            line-height: 1.65;
        }

        /* Deep Space Background with Twinkling Stars */
        body {
            background-color: #070a14;
            background-image: radial-gradient(circle at 50% 25%, #111833 0%, #0b0f1e 50%, #070a14 85%);
            color: #e2e8f0;
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.7); }
            50% { opacity: 0.95; transform: scale(1.3); }
        }

        /* HUD Panel Styling */
        .hud-panel {
            background: rgba(11, 15, 30, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .hud-panel-glow {
            border-color: rgba(230, 157, 53, 0.6);
            box-shadow: 0 0 25px rgba(230, 157, 53, 0.18);
        }

        .hud-badge {
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(18, 24, 45, 0.9);
            color: #94a3b8;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #070a14;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
        }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden uppercase selection:bg-[#e69d35] selection:text-navy-950 flex flex-col justify-between">

    <!-- Twinkling Stars Background -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- HEADER -->
    <header class="relative z-10 hud-panel border-x-0 border-t-0 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="grid grid-cols-2 gap-0.5 w-4 h-4">
                <span class="bg-white block"></span>
                <span class="bg-white/60 block"></span>
                <span class="bg-white/60 block"></span>
                <span class="bg-white block"></span>
            </div>
            <span class="text-xs font-bold tracking-widest text-white">LUNARSE X</span>
        </div>
        <div class="hud-badge px-3 py-1.5 rounded-full text-[7px] flex items-center space-x-2">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>DEVELOPER TEAM</span>
        </div>
    </header>

    <!-- MAIN CENTER CONTENT -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center p-6 max-w-6xl mx-auto w-full space-y-8">
        
        <!-- Header Text -->
        <div class="text-center space-y-3">
            <div class="inline-block px-4 py-1.5 rounded-full bg-white text-navy-950 text-[7px] font-bold tracking-widest shadow">
                LUNARSE X CREATORS
            </div>
            <h1 class="text-lg md:text-2xl tracking-widest text-white font-bold">
                THANK YOU <span class="text-[#e69d35]">FOR EXPLORING</span>
            </h1>
            <p class="text-[7px] text-slate-400 tracking-wider max-w-lg mx-auto">
                FROM EARTH TO OTHER WORLDS &bull; USING EARTH'S DATA TO FIND THE NEXT FRONTIER.
            </p>
        </div>

        <!-- DEVELOPERS GRID (Centered 3 top, 2 centered bottom) -->
        <div class="flex flex-wrap justify-center gap-6 w-full">
            
            <!-- Card 1: Ritag -->
            <div class="hud-panel hud-panel-glow rounded-2xl p-4 flex flex-col items-center space-y-3 text-center w-full sm:w-72 md:w-80">
                <div class="w-full h-56 rounded-xl overflow-hidden border border-slate-700 bg-navy-950 flex items-center justify-center relative">
                    <img src="Ritag.jpeg" alt="Ritag" class="w-full h-full object-cover object-top">
                </div>
                <span class="text-[9px] text-[#e69d35] font-bold tracking-widest pt-1">Lunarse X</span>
                <span class="text-[7px] text-slate-300">Ritag</span>
            </div>

            <!-- Card 2: Yasmin -->
            <div class="hud-panel hud-panel-glow rounded-2xl p-4 flex flex-col items-center space-y-3 text-center w-full sm:w-72 md:w-80">
                <div class="w-full h-56 rounded-xl overflow-hidden border border-slate-700 bg-navy-950 flex items-center justify-center relative">
                    <img src="Yasmin.jpeg" alt="Yasmin" class="w-full h-full object-cover object-[50%_15%]">
                </div>
                <span class="text-[9px] text-[#e69d35] font-bold tracking-widest pt-1">Lunarse X</span>
                <span class="text-[7px] text-slate-300">Yasmin</span>
            </div>

            <!-- Card 3: Moaz -->
            <div class="hud-panel hud-panel-glow rounded-2xl p-4 flex flex-col items-center space-y-3 text-center w-full sm:w-72 md:w-80">
                <div class="w-full h-56 rounded-xl overflow-hidden border border-slate-700 bg-navy-950 flex items-center justify-center relative">
                    <img src="Moaz.jpeg" alt="Moaz" class="w-full h-full object-cover object-top">
                </div>
                <span class="text-[9px] text-[#e69d35] font-bold tracking-widest pt-1">Lunarse X</span>
                <span class="text-[7px] text-slate-300">Moaz</span>
            </div>

            <!-- Card 4: Omnia (Position adjusted higher) -->
            <div class="hud-panel hud-panel-glow rounded-2xl p-4 flex flex-col items-center space-y-3 text-center w-full sm:w-72 md:w-80">
                <div class="w-full h-56 rounded-xl overflow-hidden border border-slate-700 bg-navy-950 flex items-center justify-center relative">
                    <img src="Omnia.jpeg" alt="Omnia" class="w-full h-full object-cover object-[50%_30%]">
                </div>
                <span class="text-[9px] text-[#e69d35] font-bold tracking-widest pt-1">Lunarse X</span>
                <span class="text-[7px] text-slate-300">Omnia</span>
            </div>

            <!-- Card 5: Shahd -->
            <div class="hud-panel hud-panel-glow rounded-2xl p-4 flex flex-col items-center space-y-3 text-center w-full sm:w-72 md:w-80">
                <div class="w-full h-56 rounded-xl overflow-hidden border border-slate-700 bg-navy-950 flex items-center justify-center relative">
                    <img src="shahd.jpeg" alt="Shahd" class="w-full h-full object-cover object-top">
                </div>
                <span class="text-[9px] text-[#e69d35] font-bold tracking-widest pt-1">Lunarse X</span>
                <span class="text-[7px] text-slate-300">Shahd</span>
            </div>

        </div>

        <!-- Go Back Button -->
        <div class="pt-4">
            <button onclick="goBack()" class="px-8 py-3 rounded-xl text-[8px] bg-[#e69d35] text-navy-950 font-extrabold hover:bg-[#cf8729] transition flex items-center space-x-3 shadow-lg shadow-[#e69d35]/30">
                <i class="fa-solid fa-arrow-left"></i>
                <span>GO BACK</span>
            </button>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="relative z-10 hud-panel border-x-0 border-b-0 py-3 px-6 text-center text-[7px] text-slate-500">
        LUNARSE X Mission Control &bull; Secure Uplink v4.8 &bull; All Rights Reserved
    </footer>

    <!-- SCRIPT LOGIC -->
    <script>
        // --- TWINKLING STARS BACKGROUND ---
        function initStars() {
            const container = document.getElementById('starsContainer');
            const count = 140;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 0.6;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 1.5}s`);
                star.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(star);
            }
        }

        // --- NAVIGATION BACK TO MAIN ---
        function goBack() {
            window.location.href = 'main.html';
        }

        window.onload = function() {
            initStars();
        };
    </script>
</body>
</html>
